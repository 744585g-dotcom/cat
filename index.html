<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводчик на Пурхальский</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; resize: vertical; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 25px; text-align: left; }
        label { font-weight: bold; color: #555; }
        .output { background: #e9ecef; padding: 15px; border-radius: 8px; font-size: 18px; min-height: 50px; word-wrap: break-word; font-weight: bold; color: #111; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🪐 Пурхальский Переводчик</h1>
    <textarea id="inputText" placeholder="Вставьте или напечатайте сюда любой русский текст..."></textarea>
    <button onclick="translateText()">ПЕРЕВЕСТИ</button>
    
    <div class="result-box">
        <label>Результат:</label>
        <div id="outputText" class="output">Здесь появится ваш перевод...</div>
    </div>
</div>

<script>
function translateText() {
    const text = document.getElementById("inputText").value;
    const dictionary = {
        'а': 'и', 'б': 'м', 'в': 'н', 'г': 'с', 'д': 'п', 'е': 'у', 'ё': 'е', 'ж': 'з', 'з': 'ч', 'и': 'я',
        'й': 'ф', 'к': 'х', 'л': 'ц', 'м': 'р', 'н': 'к', 'о': 'э', 'п': 'д', 'р': 'щ', 'с': 'ш', 'т': 'г',
        'у': 'ы', 'ф': 'т', 'х': 'й', 'ц': 'б', 'ч': 'ж', 'ш': 'в', 'щ': 'б', 'ъ': 'ь', 'ы': 'а', 'ь': 'ъ',
        'э': 'ю', 'ю': 'ё', 'я': 'о',
        'А': 'И', 'Б': 'М', 'В': 'Н', 'Г': 'С', 'Д': 'П', 'Е': 'У', 'Ё': 'Е', 'Ж': 'З', 'З': 'Ч', 'И': 'Я',
        'Й': 'Ф', 'К': 'Х', 'Л': 'Ц', 'М': 'Р', 'Н': 'К', 'О': 'Э', 'П': 'Д', 'Р': 'Щ', 'С': 'Ш', 'Т': 'Г',
        'У': 'Ы', 'Ф': 'Т', 'Х': 'Й', 'Ц': 'Б', 'Ч': 'Ж', 'Ш': 'В', 'Щ': 'Б', 'Ъ': 'Ь', 'Ы': 'А', 'Ь': 'Ъ',
        'Э': 'Ю', 'Ю': 'Ё', 'Я': 'О'
    };
    
    let result = "";
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        result += dictionary[char] ? dictionary[char] : char;
    }
    
    document.getElementById("outputText").innerText = result;
}
</script>

</body>
</html>
